    steps:
      - name: Appel de la base
        run: |
          curl -sS --fail -X POST "https://lxmpiiwgofmpcbdbhens.supabase.co/rest/v1/rpc/ct_ping" \
            -H "apikey: sb_publishable_MOnmoccuJcQVvMJ4WbigzA_DnvN0-fZ" \
            -H "Authorization: Bearer sb_publishable_MOnmoccuJcQVvMJ4WbigzA_DnvN0-fZ" \
            -H "Content-Type: application/json" -d '{}'
